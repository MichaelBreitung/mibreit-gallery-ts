version: '3'

vars:
  IIFE_LIBRARY_PATH:
    ref: joinPath .ROOT_DIR "lib-iife/mibreitGalleryTs.min.js"

tasks:
  release:
    desc: 'Build, create and upload the iife library as a GitHub Release'
    requires:
      vars: [VERSION]
    cmds:
      - task: :common:check-version-higher
        vars: { VERSION: '{{.VERSION}}' }
      - task: build
      - task: update-version
        vars: { VERSION: '{{.VERSION}}' }
      # Because create will create a tag and attach to master, we must first create a release branch,
      # push the package.json, inform the user to create a PR and merge it, then run the craete and upload tasks.
      - cmd: git checkout -b release/{{shellQuote .VERSION}}
      - cmd: git add package.json
      - cmd: git commit -m "Release {{shellQuote .VERSION}}"
      - cmd: git push origin HEAD
      - cmd: echo "In Github, create a pull request for the release branch and merge it into master."
      # Pause the task execution to allow the user to create a PR and merge it before proceeding with the upload.
      - cmd: read -p "Press Enter to continue after merging the pull request..."
      - cmd: git checkout master
      - cmd: git pull origin master
      - task: create
        vars: { VERSION: '{{.VERSION}}' }
      - task: upload
        vars: { VERSION: '{{.VERSION}}' }

  build:
    desc: 'Build the iife library'
    cmd: npm run build

  update-version:
    desc: 'Update the package version'
    requires:
      vars: [VERSION]
    vars:
      RELEASE_TAG: '{{.VERSION}}'
    cmds:
      - task: :common:check-version-format
        vars: { VERSION: '{{.VERSION}}' }
      - cmd: npm pkg set version={{shellQuote .VERSION}}

  create:
    desc: 'Create a GitHub Release'
    requires:
      vars: [VERSION]
    vars:
      RELEASE_TAG: '{{.VERSION}}'
    cmds:
      - task: :common:check-version-higher
        vars: { VERSION: '{{.VERSION}}' }
      - cmd: gh release create {{shellQuote .RELEASE_TAG}} --title {{shellQuote .RELEASE_TAG}} --generate-notes

  upload:
    desc: 'Upload the iife library to an existing GitHub Release'
    requires:
      vars: [VERSION]
    vars:
      RELEASE_TAG: '{{.VERSION}}'
    cmds:
      - task: :common:check-version-format
        vars: { VERSION: '{{.VERSION}}' }
      - cmd: gh release upload {{shellQuote .RELEASE_TAG}} {{shellQuote .IIFE_LIBRARY_PATH}}
    preconditions:
      - sh: test -d {{shellQuote (joinPath .ROOT_DIR "lib-iife")}}
        msg: 'Build output not found: lib-iife. Run "task build" first.'
