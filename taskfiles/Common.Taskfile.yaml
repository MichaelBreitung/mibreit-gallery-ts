version: '3'

tasks:
  check-version-format:
    desc: Check that VERSION uses the x.y.z format
    requires:
      vars: [VERSION]
    cmd: |
      if ! printf '%s' {{shellQuote .VERSION}} | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo 'VERSION must use the x.y.z format' >&2
        exit 1
      fi

  get-latest-version:
    desc: Print the latest release version from Git tags
    cmd: |
      LATEST_TAG="$(git tag --list '*[0-9].[0-9].[0-9]' --sort=-v:refname | head -n 1)"
      if test -z "$LATEST_TAG"; then
        echo 'No Git release tag found' >&2
        exit 1
      fi
      printf '%s\n' "$LATEST_TAG"

  check-version-higher:
    desc: Check that VERSION is higher than the latest release version
    requires:
      vars: [VERSION]
    cmds:
      - task: check-version-format
        vars: { VERSION: '{{.VERSION}}' }
      - cmd: |
          LATEST_TAG="$(git tag --list '*[0-9].[0-9].[0-9]' --sort=-v:refname | head -n 1)"
          HIGHEST_VERSION="$(printf '%s\n' {{shellQuote .VERSION}} "$LATEST_TAG" | sort -V | tail -n 1)"
          if test {{shellQuote .VERSION}} = "$LATEST_TAG" || test "$HIGHEST_VERSION" = "$LATEST_TAG"; then
            echo 'VERSION must be higher than the latest release version' >&2
            exit 1
          fi
