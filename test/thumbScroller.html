<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Using a width of 728px, will give even numbers for the calculated thumbs - required for testing -->
    <style>
      * {
        margin: 0;
      }
      #container {
        position: relative;
        width: 800px;
        margin-left: auto;
        margin-right: auto;
      }
      mbg-thumbscroller {
        display: block;
      }
      mbg-thumbs {
        height: 150px;
      }
    </style>
  </head>
  <!-- ThumbScroller with 7 Images -->
  <body>
    <div id="container">
      <mbg-thumbscroller id="thumbScroller" numberOfVisibleThumbs="6">
        <mbg-thumbs>
          <img
            alt="Detroit"
            loading="lazy"
            src="/demo/images/Detroit.jpg"
            width="815"
            height="1280"
          />
          <img
            alt="Essaouira Surf"
            loading="lazy"
            src="/demo/images/Essaouira-Surf.jpg"
            width="1280"
            height="853"
          />
          <img
            alt="Fisherman's Bastion"
            loading="lazy"
            src="/demo/images/Fishermans-Bastion.jpg"
            width="1280"
            height="853"
          />
          <img
            alt="Salt"
            loading="lazy"
            src="/demo/images/Salt.jpg"
            width="1280"
            height="853"
          />
          <img
            alt="Stubai Mountains"
            loading="lazy"
            src="/demo/images/Stubai-Mountains.jpg"
            width="1280"
            height="853"
          />
          <img
            alt="Bloody Causeway"
            loading="lazy"
            src="/demo/images/bloody-causeway.jpg"
            width="853"
            height="1280"
          />
          <img
            alt="Detroit"
            loading="lazy"
            src="/demo/images/Detroit.jpg"
            width="815"
            height="1280"
          />
        </mbg-thumbs>
      </mbg-thumbscroller>
    </div>
  </body>
</html>
