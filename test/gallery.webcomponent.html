<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
      }
      #container {
        position: relative;
        width: 40rem;
        margin-left: auto;
        margin-right: auto;
      }
      mbg-images {
        height: 30rem;
      }
      mbg-thumbs {
        margin-top: 1rem;
      }
      mbg-title {
        font-size: 2rem;
      }
      .mbll__marker {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <mbg-gallery numberOfVisibleThumbs="4" loaderWindowLeft="1" loaderWindowRight="2">
        <mbg-images>
          <img
          alt="Detroit"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Detroit.jpg"
            title="Detroit"
            width="815"
            height="1280"
          />
          <img
          alt="Essaouira Surf"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Essaouira-Surf.jpg"
            title="Essaouira Surf"
            width="1280"
            height="853"
          />
          <img
          alt="Fisherman's Bastion"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Fishermans-Bastion.jpg"
            title="Fisherman's Bastion"
            width="1280"
            height="853"
          />
          <img
          alt="Salt"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Salt.jpg"
            title="Salt"
            width="1280"
            height="853"

            title="Stubai Mountains"
            width="1280"
            height="853"

          <img

            loading="lazy"
            class="mbll__marker"
            src="/demo/images/bloody-causeway.jpg"
            title="Bloody Causeway"
            width="853"
            height="1280"
          />
          <img
          alt="Detroit"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Detroit.jpg"
            title="Detroit"
            width="815"
            height="1280"
          />
        </mbg-images>
        <mbg-thumbs>
          <img
          alt="Essaouira Surf"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Essaouira-Surf.jpg"
            title="Essaouira Surf"
            width="1280"
            height="853"

          <img

          <img

            loading="lazy"

            width="1280"
            height="853"
          />
          <img
          alt="Stubai Mountains"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Stubai-Mountains.jpg"
            title="Stubai Mountains"
            width="1280"
            height="853"
          />
          <img
          alt="Bloody Causeway"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/bloody-causeway.jpg"
            title="Bloody Causeway"
            width="853"
            height="1280"
          />
          <img
          alt="Detroit"
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Detroit.jpg"
            title="Detroit"
            width="815"
            height="1280"
          />
          <img
          alt="Essaouira Surf"

</html>
