<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
      }
      #container {
        position: relative;
        width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      mbg-gallery {
        display: block;
      }
      mbg-images {
        height: 500px;
      }
      mbg-thumbs {
        height: 7rem;
      }
      .mbll__marker {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <mbg-gallery numberOfVisibleThumbs="7" loaderWindowLeft="1" loaderWindowRight="2">
        <mbg-images>
        <img
          alt="Essaouira Surf"
          loading="lazy"
          class="mbll__marker"
          src="/demo/images/Essaouira-Surf.jpg"
          title="Test Title"
          width="1280"
          height="853"
        />
        </mbg-images>
        <mbg-thumbs>
          <img
          alt="Essaouira Surf"
          loading="lazy"
          class="mbll__marker"
          src="/demo/images/Essaouira-Surf.jpg"
          title="Test Title"
          width="1280"
          height="853"
          />
        </mbg-thumbs>
      </mbg-gallery>
    </div>
  </body>
</html>
