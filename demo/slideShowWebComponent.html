<!doctype html>
<html lang="en">
  <head>
    <meta name="copyright" content="Michael Breitung" />
    <meta name="author" content="Michael Breitung" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Gallery Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .content {
        box-sizing: border-box;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
      }

      mbg-slideshow {
        width: 100%;
      }

      @media (min-width: 768px) {
        .content {
          max-width: 60rem;
        }
      }
      mbg-images {
        height: 40rem;
      }
      .mbll__marker {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <a href="/"><strong>Home</strong></a>
    <div class="content">
      <mbg-slideshow loaderWindowLeft="1" loaderWindowRight="2" interval="4000" zoom initialImageNr="0">
        <mbg-images>
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Detroit.jpg"
            title="Detroit"
            alt="Detroit"
            width="815"
            height="1280"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Essaouira-Surf.jpg"
            title="Essaouira Surf"
            alt="Essaouira Surf"
            width="1280"
            height="853"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Fishermans-Bastion.jpg"
            title="Fisherman's Bastion"
            alt="Fisherman's Bastion"
            width="1280"
            height="853"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Salt.jpg"
            title="Salt"
            alt="Salt"
            width="1280"
            height="853"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Stubai-Mountains.jpg"
            title="Stubai Mountains"
            alt="Stubai Mountains"
            width="1280"
            height="853"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/bloody-causeway.jpg"
            title="Bloody Causeway"
            alt="Bloody Causeway"
            width="853"
            height="1280"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Detroit.jpg"
            title="Detroit"
            alt="Detroit"
            width="815"
            height="1280"
          />
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Essaouira-Surf.jpg"
            title="Essaouira Surf"
            alt="Essaouira Surf"
            width="1280"
            height="853"
          />
        </mbg-images>
      </mbg-slideshow>
      <br />
      <mbg-slideshow expand>
        <mbg-images>
          <img
            loading="lazy"
            class="mbll__marker"
            src="/demo/images/Fishermans-Bastion.jpg"
            title="Fisherman's Bastion"
            alt="Fisherman's Bastion"
            width="1280"
            height="853"
          />
        </mbg-images>
      </mbg-slideshow>
    </div>
  </body>
  <script type="module" src="/src/index.ts"></script>
</html>
