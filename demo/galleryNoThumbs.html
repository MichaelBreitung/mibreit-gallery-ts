<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="copyright" content="Michael Breitung" />
    <meta name="author" content="Michael Breitung" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Gallery No Thumbs Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      #container {
        position: relative;
        height: 40rem;
        margin-left: auto;
        margin-right: auto;
        overflow: hidden;
      }
      #title {
        font-size: 2rem;
        text-align: center;
      }
      .mbll__marker {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <a href="/"><strong>Home</strong></a>
    <div id="container">
      <img
      loading="lazy"
      class="mbll__marker"
      src="/demo/images/Detroit.jpg"
      data-title="Detroit"
      alt="Detroit"
      width="815"
      height="1280"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Essaouira Surf"
      src="/demo/images/Essaouira-Surf.jpg"
      alt="Essaouira Surf"
      width="1280"
      height="853"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      src="/demo/images/Fishermans-Bastion.jpg"
      title="Fisherman's Bastion"
      alt="Fisherman's Bastion"
      width="1280"
      height="853"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Salt"
      src="/demo/images/Salt.jpg"
      alt="Salt"
      width="1280"
      height="853"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Secret Beach"
      src="/demo/images/Stubai-Mountains.jpg"
      title="Stubai Mountains"
      alt="Stubai Mountains"
      width="1280"
      height="853"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Bloody Causeway"
      src="/demo/images/bloody-causeway.jpg"
      alt="Bloody Causeway"
      width="853"
      height="1280"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      src="/demo/images/Detroit.jpg"
      data-title="Detroit"
      alt="Detroit"
      width="815"
      height="1280"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Essaouira Surf"
      src="/demo/images/Essaouira-Surf.jpg"
      alt="Essaouira Surf"
      width="1280"
      height="853"
      />
      <img
      loading="lazy"
      class="mbll__marker"
      data-title="Fisherman's Bastion"
      src="/demo/images/Fishermans-Bastion.jpg"
      alt="Fisherman's Bastion"
      width="1280"
      height="853"
      />
    </div>
    <h2 id="title">Title</h2>
  </body>
  <script type="module">
    import { createGallery, EImageScaleMode } from '/src/index.ts';
    const gallery = createGallery('#container', '#container > img', {
      scaleMode: EImageScaleMode.FIT_ASPECT,
    });
    const titleElement = document.querySelector('#title');
    const viewer = gallery.getImageViewer();
    const imageInfo = viewer.getImageInfo(viewer.getImageIndex());
    if (imageInfo) {
      titleElement.innerHTML = imageInfo.getTitle();
    }
    viewer.addImageChangedCallback((index, imageInfo) => {
      titleElement.innerHTML = imageInfo.getTitle();
    });
  </script>
</html>
